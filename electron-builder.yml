appId: com.clinicalsuppression.huggingfacebrowser
productName: Hugging Face Browser
directories:
  output: dist-release
files:
  - dist/**/*
  - dist-electron/**/*
  - assets/icon.ico
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
nsis:
  artifactName: ${productName}-${version}-Setup-${arch}.${ext}
portable:
  artifactName: ${productName}-${version}-Portable-${arch}.${ext}
