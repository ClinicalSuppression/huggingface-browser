appId: com.clinicalsuppression.huggingfacebrowser
productName: Hugging Face Browser
directories:
  output: dist-release
files:
  - dist/**/*
  - dist-electron/**/*
  - assets/icon.ico
  - package.json
win:
  target:
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
portable:
  artifactName: HF-Browser-${version}-Portable-${arch}.${ext}
